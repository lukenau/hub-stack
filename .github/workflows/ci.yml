name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: Tests (one process per file — see requirements-dev.txt)
        run: bash run_tests.sh

  app:
    name: app (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q && echo "compose OK"

  hygiene:
    name: publish gate (no work/personal markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One implementation of the gate, not two. The inline grep that used to
      # live here was a cruder copy of scripts/hub-stack-gate.sh: it did not
      # exclude the gate script itself (so the guard's own pattern lines
      # matched) and its bare \.ts\.net flagged legitimate public Tailscale
      # docs. The script excludes itself and matches the author's actual
      # tailnet, so CI runs the script.
      - name: Run the publish gate
        run: bash scripts/hub-stack-gate.sh

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the PR base commit
      - name: Check Developer Certificate of Origin sign-offs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-dco.sh
