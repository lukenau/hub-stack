name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: Tests (one process per file — see requirements-dev.txt)
        run: bash run_tests.sh

  murmur-bridge:
    name: murmur-bridge (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/murmur-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/murmur-bridge/requirements-dev.txt
      # opuslib (imported by murmur/bridge/audio.py) binds the system libopus
      # with ctypes; the shared library is not a pip dependency, so the suite
      # cannot even be collected without it.
      - name: System deps (libopus)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus0
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q murmur
      - name: Tests
        run: PYTHONPATH=. python -m pytest murmur/tests -q

  app:
    name: app (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # The repo checks that a public clone can actually run (the raw-colour
      # guard). The PWA-parity checks — theme light-block parity, token
      # freshness, the vendored xterm bundle and shared-copy parity — compare
      # the app against apps/hub, which is NOT in this repo, so they cannot run
      # here. `npm run check` says so explicitly rather than reporting them as
      # passing; run `npm run check:pwa` in a checkout that has the PWA.
      - name: Repo checks
        run: npm run check
      # The web export is a shipped capability (docs/CONNECT-APP.md): the same
      # app exported for the browser. Build it and scan the artifact here so the
      # ability cannot quietly rot — check:web fails on any leaked identifier,
      # hostname, path or secret in the bundle the browser would receive.
      - name: Web export + bundle scan
        run: npm run build:web && npm run check:web
      # This step is the point of the job: the full jest suite. It is
      # serialised (--maxWorkers=1, via `test:ci`) on purpose. The suite has a
      # documented cross-file mock leak under parallel workers
      # (jest.config.js:18, jest.setup.js:45-85) that surfaces as
      # nondeterministic failures on a loaded box; until the isolation fix lands
      # (see the hermeticity card) CI runs one worker so the gate is
      # deterministic. A flaky gate is worse than a slow one.
      - name: Tests (jest, serialised)
        run: npm run test:ci

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q && echo "compose OK"

  hygiene:
    name: publish gate (no work/personal markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One implementation of the gate, not two. The inline grep that used to
      # live here was a cruder copy of scripts/hub-stack-gate.sh: it did not
      # exclude the gate script itself (so the guard's own pattern lines
      # matched) and its bare \.ts\.net flagged legitimate public Tailscale
      # docs. The script excludes itself and matches the author's actual
      # tailnet, so CI runs the script.
      - name: Run the publish gate
        run: bash scripts/hub-stack-gate.sh .
      # A rule that never fires is dead weight: plant one probe per rule and
      # assert the gate blocks on every one (and passes on a clean tree). The
      # probes are built at runtime, so the guard names no marker it guards.
      - name: Gate self-test (every rule still fires)
        run: bash scripts/hub-stack-gate.sh --self-test

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the PR base commit
      - name: Check Developer Certificate of Origin sign-offs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-dco.sh
