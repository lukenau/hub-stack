<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Xavier — a personal AI agent you host yourself">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ab5e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f0ab5e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a26"/>
      <stop offset="100%" stop-color="#101d17"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#000d0e"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="url(#edge)"/>

  <!-- hub mark: a centre node with spokes, the shape of the product -->
  <g transform="translate(150 160)">
    <circle r="66" fill="none" stroke="#f0ab5e" stroke-opacity="0.28" stroke-width="2"/>
    <g stroke="#f0ab5e" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-38" x2="0" y2="-66"/>
      <line x1="33" y1="-19" x2="57" y2="-33"/>
      <line x1="33" y1="19" x2="57" y2="33"/>
      <line x1="0" y1="38" x2="0" y2="66"/>
      <line x1="-33" y1="19" x2="-57" y2="33"/>
      <line x1="-33" y1="-19" x2="-57" y2="-33"/>
    </g>
    <circle r="16" fill="#f0ab5e"/>
    <circle r="30" fill="none" stroke="#f0ab5e" stroke-opacity="0.65" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <text x="268" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="96" font-weight="600" letter-spacing="14" fill="#f4f4f3">XAVIER</text>
  <rect x="271" y="176" width="112" height="4" fill="#f0ab5e"/>
  <text x="268" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27" letter-spacing="0.6" fill="#8fa39b">a personal AI agent you host yourself</text>
</svg>
